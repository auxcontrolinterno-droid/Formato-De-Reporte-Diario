<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>Reporte diario de novedades – Altamira International School</title><meta name="theme-color" content="#25549f">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f6f9;--sf:#fff;--tx:#1b2230;--mu:#6a7385;--bd:#d5d9e2;--pr:#25549f;--ye:#e4483b;--rd:#c0392b;--rb:#fdecea;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161f;--sf:#1b212d;--tx:#e8ebf2;--mu:#99a2b5;--bd:#333c4e;--pr:#7ea3ff;--ye:#b3372e;--rd:#ff8a7a;--rb:#3b1f1c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12161f;--sf:#1b212d;--tx:#e8ebf2;--mu:#99a2b5;--bd:#333c4e;--pr:#7ea3ff;--ye:#b3372e;--rd:#ff8a7a;--rb:#3b1f1c;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}html,body{overscroll-behavior-y:none}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sf);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--sf);border-bottom:1px solid var(--bd);z-index:5;padding:8px 12px}
h1{font-size:15px;margin:0 0 6px}nav{display:flex;gap:6px;flex-wrap:wrap}
nav button,.btn{border:1px solid var(--bd);background:var(--sf);color:var(--tx);padding:8px 12px;border-radius:8px;font:inherit;cursor:pointer}
nav button.on,.btn.pr{background:var(--pr);color:#fff;border-color:var(--pr)}
html[data-theme=dark] nav button.on,html[data-theme=dark] .btn.pr{color:#111}
main{max-width:1000px;margin:0 auto;padding:12px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:14px}
.sec{background:var(--ye);color:#fff;font-weight:700;text-align:center;padding:6px;border-radius:6px;margin:16px 0 6px}
.wrap{overflow-x:auto;border:1px solid var(--bd);border-radius:8px;max-width:100%}
table{border-collapse:collapse;width:100%;min-width:0;font-size:13px}
th,td{border:1px solid var(--bd);padding:0;text-align:center}
th{background:var(--bg);padding:4px 2px;font-size:11px}
td.n{text-align:left;padding:4px 5px;position:sticky;left:0;background:var(--sf);min-width:96px;font-size:12px;line-height:1.2;z-index:1}
td.n small{color:var(--mu)}
td.c{width:44px;height:40px;cursor:pointer;user-select:none;color:var(--mu)}
td.c.x{background:var(--rb);color:var(--rd);font-weight:700}
input,textarea,select{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:8px;width:100%}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
label{font-size:12px;color:var(--mu);display:block;margin-bottom:3px}
canvas{width:100%;height:120px;border:1px dashed var(--mu);border-radius:8px;background:#fff;touch-action:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.mu{color:var(--mu);font-size:12px}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
.k div{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:10px}.k b{font-size:22px;display:block}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;background:var(--rb);color:var(--rd);font-size:12px}
.ok{background:#e1f5e8;color:#1c7a3f}.msg{padding:8px;border-radius:8px;margin:8px 0}.err{background:var(--rb);color:var(--rd)}.good{background:#e1f5e8;color:#1c7a3f}
details{border-top:1px solid var(--bd);padding:8px 0}summary{cursor:pointer}
.sig{max-width:260px;background:#fff;border:1px solid var(--bd);border-radius:6px}
.hide{display:none}
td.p{width:76px;min-width:76px;cursor:pointer;font-size:15px;user-select:none;white-space:nowrap}
td.p img{display:inline-block;vertical-align:middle;width:30px;height:30px;object-fit:cover;margin:2px;border-radius:4px}
#pv{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px}
#pv img{max-width:100%;max-height:70vh;border-radius:8px}
.sigbox{border:1px dashed var(--mu);border-radius:8px;background:#fff;min-height:90px;display:flex;align-items:center;justify-content:center;margin:0 0 8px}
.sigbox .sig{border:0;max-width:100%;max-height:110px;border-radius:0}
#sg{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px;color:#fff}
#sg canvas{width:min(94vw,640px);height:min(46vh,300px);border:2px solid #fff;border-radius:8px;background:#fff;touch-action:none}
header{box-shadow:0 1px 6px rgba(20,30,60,.08)}h1{font-size:15px;letter-spacing:.3px}
nav button{font-weight:600}
.k div{border-top:4px solid var(--pr);box-shadow:0 1px 3px rgba(20,30,60,.06)}
.k small{display:block;color:var(--mu);font-size:12px;margin-bottom:2px}.k em{font-style:normal;color:var(--mu);font-size:11px}
.k .k2{border-top-color:var(--rd)}.k .k3{border-top-color:#e6a117}.k .k4{border-top-color:#1c9a5a}
.ct{font-weight:700;margin-bottom:10px}
.bars{display:flex;align-items:flex-end;gap:8px;height:130px;padding-top:6px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.bar i{display:block;width:100%;max-width:40px;background:var(--pr);border-radius:6px 6px 0 0}
.bar span{font-size:12px;font-weight:700;margin-bottom:2px}.bar em{font-style:normal;font-size:11px;color:var(--mu);margin-top:4px}
.dh{display:flex;justify-content:space-between;align-items:baseline;margin:20px 2px 8px;padding-bottom:4px;border-bottom:2px solid var(--bd);text-transform:capitalize;font-weight:700}
.dh small{text-transform:none;color:var(--mu);font-weight:400;font-size:12px}
.rc{background:var(--sf);border:1px solid var(--bd);border-left:5px solid var(--rd);border-radius:10px;padding:12px;margin-bottom:12px;box-shadow:0 1px 3px rgba(20,30,60,.06)}
.rc.sn{border-left-color:#1c9a5a}
.rh{display:flex;gap:8px;align-items:flex-start;line-height:1.25}
.tg{flex:none;color:#fff;font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;background:var(--pr)}.tg.t2{background:#0f8a6a}
html[data-theme=dark] .tg{color:#111}
.rb{margin:8px 0;display:flex;gap:6px;flex-wrap:wrap}
.mg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 12px;font-size:13px}
.mg small{display:block;color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.4px}
.pill.wn{background:rgba(230,160,20,.18);color:#b87400}
.nv{margin:8px 0;padding:8px;border-radius:8px;background:var(--bg)}
details{margin-top:10px}summary{font-weight:600;color:var(--pr)}
.rec{min-width:0}.rec textarea{resize:vertical;margin-top:6px}
.rn{background:var(--bg);border-left:3px solid var(--pr);border-radius:8px;padding:8px 10px;margin:8px 0;word-break:break-word}
.rn small{color:var(--mu);display:inline-block;margin:4px 8px 0 0}

.dsub{display:flex;gap:4px;margin:0 0 12px;border-bottom:2px solid var(--bd)}
.dsub button{border:0;background:none;color:var(--mu);font:inherit;font-weight:700;padding:10px 14px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.dsub button.on{color:var(--pr);border-bottom-color:var(--pr)}
.ac2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.ac2 .card{margin-bottom:0}
.ac-t{width:100%;border-collapse:collapse;font-size:13px}
.ac-t th{background:var(--bg);padding:6px 8px;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.3px;color:var(--mu)}
.ac-t td{padding:8px;text-align:left;border:0;border-top:1px solid var(--bd)}
.ac-i{background:var(--bg);border-radius:8px;padding:8px 10px;margin-bottom:8px;word-break:break-word;display:flex;justify-content:space-between;align-items:center;gap:8px}.ac-i small{display:block;color:var(--mu)}
.ac-o{flex:none;border-color:var(--rd);color:var(--rd);padding:6px 10px;font-size:13px;font-weight:600}.ac-o:disabled{opacity:.5}
.ac-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.ac-h .ct{margin:0}
.bp{background:var(--sf);border:1px solid var(--bd);border-left:5px solid var(--pr);border-radius:10px;padding:12px;margin-bottom:12px;box-shadow:0 1px 3px rgba(20,30,60,.06)}
.bp h3{margin:0;font-size:15px;line-height:1.25}
.bp .nv{margin:8px 0 0}.bp .nv b{display:block;margin-bottom:6px;font-size:13px}
.bp .mg b{font-weight:600;word-break:break-word}
.pill.gy{background:var(--bg);color:var(--mu)}

/* ===== REDISEÑO VISUAL (capa encima del CSS original; borrar este bloque la revierte) ===== */
:root{--pr:#1f2d52;--rd:#982424;--ink:#1f2d52;--ink2:#1f2d52;--sig:#f2c800;--xbg:#982424;--xtx:#fff;--rs:6px;--rm:8px;--rl:12px;--fd:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;--fb:"Barlow","Segoe UI",system-ui,-apple-system,sans-serif}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--pr:#93a9e6;--ink:#0f1730;--ink2:#2a3d6e;--xbg:#ff8a7a;--xtx:#2b0e0a}}
:root[data-theme="dark"]{--pr:#93a9e6;--ink:#0f1730;--ink2:#2a3d6e;--xbg:#ff8a7a;--xtx:#2b0e0a}
body{font-family:var(--fb)}
body::before{background:var(--sf)}
:focus-visible{outline:3px solid var(--sig);outline-offset:2px}
/* Encabezado */
header{position:static;background:var(--sf);border:0;border-bottom:4px solid var(--sig);box-shadow:none;padding:12px max(14px,calc((100% - 1000px)/2 + 14px))}
.brand{display:flex;align-items:center;flex-wrap:wrap;gap:8px 16px}
.brand img{height:46px;width:auto;display:block;background:#fff;border-radius:8px;padding:3px 8px;margin-left:-8px}
.brand>div{flex:1;min-width:200px}
header h1{font:700 25px/1.05 var(--fd);letter-spacing:.2px;margin:0;color:var(--pr)}
header p{margin:4px 0 0;font-size:13px;line-height:1.3;color:var(--mu)}
header p b{display:block;font-weight:600;color:var(--tx)}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);display:flex;flex-wrap:nowrap;gap:2px;overflow-x:auto;padding:0 max(8px,calc((100% - 1000px)/2 + 8px));border-bottom:1px solid rgba(255,255,255,.14)}
nav button,nav button.on,html[data-theme=dark] nav button.on{background:none;border:0;border-radius:0;color:#b8c3dc;font:600 15px var(--fb);padding:13px 14px 11px;white-space:nowrap}
nav button.on,html[data-theme=dark] nav button.on{color:#fff;box-shadow:inset 0 -4px 0 var(--sig)}
/* Tarjetas y botones */
.card{border-radius:var(--rl);box-shadow:0 1px 2px rgba(15,29,58,.05)}
#form>.card:first-child{border-left:6px solid var(--sig)}
#form>.card:first-child>b{display:block;font:700 20px/1.15 var(--fd)}
.btn{min-height:44px;border-radius:var(--rm);font-weight:600}
.ct{font:700 18px/1.2 var(--fd)}
/* Secciones y tabla del formulario */
.sec{background:var(--ink2);color:#fff;text-align:left;font:700 18px/1.2 var(--fd);letter-spacing:.2px;padding:10px 12px;border-left:6px solid var(--sig);border-radius:var(--rm) var(--rm) 0 0;margin:22px 0 0}
.sec+.wrap{border-top:0;border-radius:0 0 var(--rm) var(--rm)}
table{font-variant-numeric:tabular-nums}
th{background:var(--bg);color:var(--mu);font:600 12px var(--fb);padding:7px 3px}
td.n{font-size:13px;min-width:112px}
td.n small{color:var(--mu);font:700 12px var(--fd);margin-right:3px}
td.c{height:46px;font-size:13px;color:var(--bd)}
td.c.x{background:var(--xbg);color:var(--xtx);font:700 15px var(--fd);letter-spacing:.4px}
td.c:active{transform:scale(.94)}
/* Dashboard: indicadores */
.k div{border:1px solid var(--bd);border-left:5px solid var(--pr);border-radius:var(--rm);box-shadow:none;padding:10px 12px}
.k .k2{border-left-color:var(--rd)}.k .k3{border-left-color:var(--sig)}.k .k4{border-left-color:#5b6b94}
.k small{font-size:13px}
.k b{font:700 36px/1 var(--fd);margin:3px 0 2px}
#dp .k .k2,#da .k>div:first-child{grid-column:span 2;order:-1;background:var(--ink);border-color:var(--ink);border-left-color:var(--sig);color:#fff}
#dp .k .k2 small,#da .k>div:first-child small,#dp .k .k2 em,#da .k>div:first-child em{color:#b8c3dc}
#dp .k .k2 b,#da .k>div:first-child b{font-size:56px;color:var(--sig)}
/* Gráfico: el día más reciente destaca */
.bars{height:150px;border-bottom:1px solid var(--bd)}
.bar i{background:var(--pr);opacity:.4;border-radius:4px 4px 0 0;max-width:36px}
.bar:last-child i{background:var(--sig);opacity:1}
.bar span{font:700 15px var(--fd)}
/* Lista de reportes */
.dh{font:700 20px/1.2 var(--fd);border-bottom:2px solid var(--ink2);margin-top:26px}
.dh small{font:400 13px var(--fb)}
.rc{border-left-width:6px;border-radius:var(--rm)}
.tg,html[data-theme=dark] .tg{background:var(--ink2);color:#fff}.tg.t2{background:var(--rd)}html[data-theme=dark] .tg.t2{background:#982424}.tg{border-radius:4px;font:700 14px var(--fd);padding:2px 8px;letter-spacing:.3px}
.mg small,.ac-t th{text-transform:none;letter-spacing:0;font-size:12px}
.dsub button{font-size:15px}.dsub button.on{color:var(--tx);border-bottom-color:var(--sig)}
/* Ingreso al dashboard */
#dash>.card:only-child{max-width:440px;margin:32px auto;border-top:5px solid var(--sig)}
#dash>.card:only-child>b{font:700 22px/1.15 var(--fd)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== PALETA DEL PDF (mismos colores de los reportes semanal y mensual; borrar este bloque la revierte) ===== */
:root{--bg:#f5f7fc;--sf:#fff;--tx:#1b2230;--mu:#6a7385;--bd:#d5d9e2;--lb:#e8eefb;--pr:#25549f;--rd:#982424;--rb:#f6e8e8;--ink:#25549f;--ink2:#25549f;--sig:#982424;--hl:#e8eefb;--xbg:#982424;--xtx:#fff;--c1:#25549f;--c2:#6e9bd7;--c3:#3ca06e;--c4:#e67e22}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121829;--sf:#1b2338;--tx:#e8eefb;--mu:#9aa6c4;--bd:#2f3a57;--lb:#26335a;--pr:#6e9bd7;--rd:#ff8a7a;--rb:#3b1f1f;--ink:#1a2a50;--ink2:#25549f;--sig:#e4483b;--hl:#e8eefb;--xbg:#982424;--xtx:#fff}}
:root[data-theme="dark"]{--bg:#121829;--sf:#1b2338;--tx:#e8eefb;--mu:#9aa6c4;--bd:#2f3a57;--lb:#26335a;--pr:#6e9bd7;--rd:#ff8a7a;--rb:#3b1f1f;--ink:#1a2a50;--ink2:#25549f;--sig:#e4483b;--hl:#e8eefb;--xbg:#982424;--xtx:#fff}
nav button,nav button.on,html[data-theme=dark] nav button.on{color:#dbe5f7}nav button.on,html[data-theme=dark] nav button.on{color:#fff}
#dp .k .k2 small,#da .k>div:first-child small,#dp .k .k2 em,#da .k>div:first-child em{color:#dbe5f7}
/* Resaltes sobre fondo azul marino: azul claro del PDF */
nav button.on,html[data-theme=dark] nav button.on{box-shadow:inset 0 -4px 0 var(--hl)}
.sec{border-left-color:var(--hl)}
#dp .k .k2,#da .k>div:first-child{border-left-color:var(--hl)}
#dp .k .k2 b,#da .k>div:first-child b{color:var(--hl)}
/* Tablas y encabezados */
th{background:var(--lb);color:var(--pr)}
.ac-t th{background:var(--lb);color:var(--pr)}
.ac-t tbody tr:nth-child(even) td{background:var(--bg)}
/* Indicadores y estados con la paleta de las gráficas del PDF */
.k .k3{border-left-color:var(--c4)}.k .k4{border-left-color:var(--c3)}
.rc.sn{border-left-color:var(--c3)}
.ok,.good{background:rgba(60,160,110,.16);color:#1d6b44}
html[data-theme=dark] .ok,html[data-theme=dark] .good{color:#8fd6ae}
.pill.wn{background:rgba(230,126,34,.16);color:#a85a12}
html[data-theme=dark] .pill.wn{color:#f0a566}

function accDate(v){
 if(!v)return null;
 if(v instanceof Date)return v;
 if(typeof v==="string"&&v.indexOf("Date(")===0){const n=v.match(/\d+/g).map(Number);return new Date(n[0],n[1],n[2],n[3]||0,n[4]||0,n[5]||0)}
 if(typeof v==="number")return new Date(Math.round((v-25569)*86400*1000));
 if(typeof v==="string"){const d=new Date(v);if(!isNaN(d))return d}
 return null;
}
function accHoy(v){const f=accDate(v);if(!f)return false;const h=new Date();return f.getDate()===h.getDate()&&f.getMonth()===h.getMonth()&&f.getFullYear()===h.getFullYear()}

 if(pc){const k=pc.dataset.p,a=st[cur].photos[k]||[],j=t.dataset?t.dataset.j:undefined;
  if(j!==undefined&&a[+j])pvShow(a[+j],k,+j);else if(a.length<MAXF)pick(k,null);
  return}
 if(act){const o=$("#pv")||{dataset:{}},k=o.dataset.k,j=+o.dataset.j;pvClose();
  if(act=="re")pick(k,j);
  if(act=="rm"&&confirm("¿Quitar esta foto?")){const a=(st[cur].photos[k]||[]).slice();a.splice(j,1);if(a.length)st[cur].photos[k]=a;else delete st[cur].photos[k];setCell(k);saveDraft();cnt()}
  return}
 if(dp){if(!window.FB)return;FB.photo(dp).then(d=>pvShow(d,null)).catch(()=>alert("No se pudo cargar la foto."))}
});

/* ===== Reportes PDF semanal / mensual (diseño tipo factura Air-e, sin fotos) ===== */
const PDF={w:today(),m:today().slice(0,7)};
const MES=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const WD=["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
const fmtD=s=>String(s).split("-").reverse().join("/");
const isoD=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const parseD=s=>{const p=String(s).split("-").map(Number);return new Date(p[0],p[1]-1,p[2]||1)};
function weekRange(s){const d=parseD(s),w=(d.getDay()+6)%7,y=d.getFullYear(),m=d.getMonth(),n=d.getDate();return[isoD(new Date(y,m,n-w)),isoD(new Date(y,m,n-w+6))]}
function monthRange(s){const d=parseD(s+"-01"),y=d.getFullYear(),m=d.getMonth();return[isoD(new Date(y,m,1)),isoD(new Date(y,m+1,0))]}
function pdfCard(){
 const r=weekRange(PDF.w||today());
 return `<div class="card"><b>Reportes PDF</b><div class="g" style="margin-top:8px">
 <div><label>Semana (elija cualquier día de la semana)</label><input type="date" id="pw" value="${PDF.w}"><div class="mu" style="margin:4px 0 8px">${fmtD(r[0])} al ${fmtD(r[1])} (lunes a domingo)</div><button class="btn pr" id="pdfw">Descargar PDF semanal</button></div>
 <div><label>Mes</label><input type="month" id="pm" value="${PDF.m}"><div class="mu" style="margin:4px 0 8px">Mes calendario completo</div><button class="btn pr" id="pdfm">Descargar PDF mensual</button></div></div>
 <div id="pdfmsg"></div></div>`}
function pdfMsg(t,c){const e=$("#pdfmsg");if(e)e.innerHTML=`<div class="msg ${c}">${t}</div>`}
document.addEventListener("change",e=>{const t=e.target;
 if(t.id=="pw"){PDF.w=t.value||today();renderDash()}
 if(t.id=="pm"){PDF.m=/^\d{4}-\d{2}$/.test(t.value)?t.value:today().slice(0,7);renderDash()}});
document.addEventListener("click",e=>{const t=e.target;if(t.id=="pdfw")makePdf("w");if(t.id=="pdfm")makePdf("m")});
function loadJs(u){return new Promise((ok,ko)=>{const s=document.createElement("script");s.src=u;s.onload=ok;s.onerror=()=>ko(new Error("No se pudo cargar "+u+". Verifique la conexión."));document.head.appendChild(s)})}
async function pdfLibs(){
 if(!window.jspdf)await loadJs("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");
 if(!window.jspdf.jsPDF.API.autoTable)await loadJs("https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js");
}
