<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>Reporte diario de novedades – AIS</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f5f6f9;--sf:#fff;--tx:#1b2230;--mu:#6a7385;--bd:#d5d9e2;--pr:#25549f;--ye:#e4483b;--rd:#c0392b;--rb:#fdecea;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161f;--sf:#1b212d;--tx:#e8ebf2;--mu:#99a2b5;--bd:#333c4e;--pr:#7ea3ff;--ye:#b3372e;--rd:#ff8a7a;--rb:#3b1f1c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12161f;--sf:#1b212d;--tx:#e8ebf2;--mu:#99a2b5;--bd:#333c4e;--pr:#7ea3ff;--ye:#b3372e;--rd:#ff8a7a;--rb:#3b1f1c;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}html,body{overscroll-behavior-y:none}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sf);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--sf);border-bottom:1px solid var(--bd);z-index:5;padding:8px 12px}
h1{font-size:15px;margin:0 0 6px}nav{display:flex;gap:6px;flex-wrap:wrap}
nav button,.btn{border:1px solid var(--bd);background:var(--sf);color:var(--tx);padding:8px 12px;border-radius:8px;font:inherit;cursor:pointer}
nav button.on,.btn.pr{background:var(--pr);color:#fff;border-color:var(--pr)}
html[data-theme=dark] nav button.on,html[data-theme=dark] .btn.pr{color:#111}
main{max-width:1000px;margin:0 auto;padding:12px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:14px}
.sec{background:var(--ye);color:#fff;font-weight:700;text-align:center;padding:6px;border-radius:6px;margin:16px 0 6px}
.wrap{overflow-x:auto;border:1px solid var(--bd);border-radius:8px;max-width:100%}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:13px}
th,td{border:1px solid var(--bd);padding:0;text-align:center}
th{background:var(--bg);padding:4px;font-size:12px}
td.n{text-align:left;padding:4px 6px;position:sticky;left:0;background:var(--sf);min-width:150px;z-index:1}
td.n small{color:var(--mu)}
td.c{width:52px;height:38px;cursor:pointer;user-select:none;color:var(--mu)}
td.c.x{background:var(--rb);color:var(--rd);font-weight:700}
input,textarea,select{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:8px;width:100%}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
label{font-size:12px;color:var(--mu);display:block;margin-bottom:3px}
canvas{width:100%;height:120px;border:1px dashed var(--mu);border-radius:8px;background:#fff;touch-action:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.mu{color:var(--mu);font-size:12px}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
.k div{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:10px}.k b{font-size:22px;display:block}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;background:var(--rb);color:var(--rd);font-size:12px}
.ok{background:#e1f5e8;color:#1c7a3f}.msg{padding:8px;border-radius:8px;margin:8px 0}.err{background:var(--rb);color:var(--rd)}.good{background:#e1f5e8;color:#1c7a3f}
details{border-top:1px solid var(--bd);padding:8px 0}summary{cursor:pointer}
.sig{max-width:260px;background:#fff;border:1px solid var(--bd);border-radius:6px}
.hide{display:none}
td.p{width:96px;min-width:96px;cursor:pointer;font-size:18px;user-select:none;white-space:nowrap}
td.p img{display:inline-block;vertical-align:middle;width:40px;height:34px;object-fit:cover;margin:2px;border-radius:4px}
#pv{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px}
#pv img{max-width:100%;max-height:70vh;border-radius:8px}
</style></head><body>
<header><h1>AIS · REPORTE DIARIO DE NOVEDADES</h1>
<nav><button data-v="r1" class="on">REPORTE 1</button><button data-v="r2">REPORTE 2</button><button data-v="dash">DASHBOARD</button></nav></header>
<main>
<div id="form"></div>
<div id="dash" class="hide"></div>
</main>
<input type="file" accept="image/*" capture="environment" id="pf" class="hide">
<script>
const COLS=["PUERTA ABIERTA","PUERTA CERRADA","CERRADURA B/E","CERRADURA M/E","AIRE ON","AIRE OFF","LUCES ON","LUCES OFF"];
const HD=[["Puertas",["Abierta","Cerrada"]],["Cerradura",["B/E","M/E"]],["Aire acond.",["ON","OFF"]],["Luces",["ON","OFF"]]];
const S=(k,t,r)=>({k,t,r:r.split("|")});
const R={
r1:{n:"Reporte 1 · CENTRO DE INNOVACIÓN, EDIFICIO ADMINISTRATIVO y CAFETORIUM",secs:[
S("ci1","Centro de Innovación – Primer piso (1)","Knowledge Lab|Código-Robótica|Laboratorio de audiovisuales|Ofic Johanna Pallares|Fotocopias|Ofic Stefanny Viscaino|Sustentabilidad|Baños niñas|Baños niños|Oficina programador|Cuarto aires acondicionados|Shark café|Biblioteca|Bodega No.1 camerinos|Baño hombres camerino|Baño mujeres camerino|Bodega No.2 camerinos|Oficina Jeferson Olmos|Oficina tecnología Manuel Arnache|Oficina tecnología Kevin"),
S("ci2","Centro de Innovación – Segundo piso (2)","Laboratorio química|Laboratorio biología|Laboratorio física|Bodega Laboratorios insumos químicos|Office tecnología|Makerspace|Cuarto de aseo|Office Director I.C.|Baños niños|Baños niñas|Fab lab"),
S("ci3","Centro de Innovación – Tercer piso (3)","Salón Bellas artes|Puerta de balcón|Puerta azotea|Bodega de Arte|Cuarto de Aires|Ofic. Dpto Música|Bodega música|Baños niñas|Baños niños|Drama|Estudio música 1|Estudio música 2|Estudio música 3|Salón de música / Music hall"),
S("ad1","Edificio Administrativo – Primer piso (1)","Baño externo|Bodega Sr Henry"),
S("ad2","Edificio Administrativo – Segundo piso","Baño externo|Oficina Jackeline V|Oficina ms Priscila|Admisiones|Secretaría académica|SST- Maryuris|Movilizate José C.|Control academy|Rack Principal|Comunicaciones|Baño interno comunitario|Comunicaciones (2)"),
S("ad3","Edificio Administrativo – Tercer piso","Baño externo|Cartera|Tesorería|Contabilidad|Gestión Humana|Bodega ms Priscila|Oficina MR Henry|Cuarto de aseo|Oficina Henry Anto"),
S("caf","Cafetorium","Cuarto staff No.1|Cuarto staff No.2|Puesto de sonido (1)|Baños niñas|Baños niños|Bodega pequeña|Cocina|Bodega de cocina|Oficina de alimentación|Ingreso personal de cocina|Puesto de sonido (2)")]},
r2:{n:"Reporte 2 · ZONA ACADÉMICA (3 pisos)",secs:[
S("ac1","ZONA ACADÉMICA – Primer piso (1)","Nursery Wasser|Nursery Dufy|Baños niños|Baños niñas|PreKinder-C|Vicerrectoría PP|PreKinder-B|Enfermería|PreKinder-A|2-A|Janintor-Feliz|Petit Cafetorium|Baños niños|Baños niñas|Dpto Spanish|2-C|2-B|Vicerrectoría Elem|Sala profesores Elem|3-C|Psicología|Ricardo Copias|3-A|3-B|Baños niños|Baños niñas|Subest/Eléctrica|4-B|4-C"),
S("ac2","ZONA ACADÉMICA – Segundo piso (2)","4-A|Psicología Alejandra|5-A|Baños niñas|Baños niños|5-B|6-B|6-A|Psicología Silvia|Salón vacío|Convivencia|7-A|7-B|Psicología Nelly|Atelier|Baños niños|Baños niñas|1-C|1-B|Gim win center|1-A|Sala profesores PP|Kinder-A|Kinder-C|Baño niñas|Baño niños|Kinder-B"),
S("ac3","ZONA ACADÉMICA – Tercer piso (3)","Octavo-A|Octavo-B|Vicerrectoría Bachillerato|Once-A|Once-B|The Fin zone|Psicología Hugo S|Sala profesores Bachi|Noveno-A|Noveno-B|Baños niños|Baños niñas|Décimo-A|Oficina control interno|Décimo-B|Doce A|Doce B|Sala profesores N|Baños niñas|Baños niños")]}
};
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let cur="r1",st={r1:null,r2:null},UID=null,AUTH=false,all=[];
function setAll(a,au){all=a;AUTH=au;if(!$("#dash").classList.contains("hide"))renderDash()}
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const fresh=()=>({marks:new Set(),photos:{},gt:null,date:today(),guard:"",sup:"",obs:"",gs:null,ss:null});
st.r1=fresh();st.r2=fresh();
function safe(f,d){try{return f()}catch(e){return d}}

function pad(a){const w=a;return w}
function renderForm(){
 const id=cur,def=R[id],s=st[id];
 let h=`<div class="card"><b>${esc(def.n)}</b><div class="g" style="margin-top:10px"><div><label>Fecha (día/mes/año)</label><input type="date" id="fd" value="${s.date}"></div></div>
 <p class="mu">Toque una casilla para marcar <b>SÍ</b> (novedad). Las casillas con raya “—” = sin novedad.</p></div>`;
 def.secs.forEach(sec=>{
  h+=`<div class="sec">${esc(sec.t)}</div><div class="wrap"><table><thead><tr><th rowspan="2">No. / Aula</th><th rowspan="2">Foto</th>${HD.map(x=>`<th colspan="2">${x[0]}</th>`).join("")}</tr><tr>${HD.map(x=>x[1].map(y=>`<th>${y}</th>`).join("")).join("")}</tr></thead><tbody>`;
  sec.r.forEach((nm,i)=>{h+=`<tr><td class="n"><small>${String(i+1).padStart(2,"0")}</small> ${esc(nm)}</td>`;{const pk=sec.k+"|"+i;h+=`<td class="p" data-p="${pk}">${cellHtml(s.photos[pk])}</td>`}
   for(let c=0;c<8;c++){const x=s.marks.has(sec.k+"|"+i+"|"+c);h+=`<td class="c${x?" x":""}" data-k="${sec.k}|${i}|${c}">${x?"SÍ":"—"}</td>`}
   h+="</tr>"});
  h+="</tbody></table></div>"});
 h+=`<div class="card" style="margin-top:14px"><label>Observaciones generales (opcional)</label><textarea id="ob" rows="3">${esc(s.obs)}</textarea></div>
 <div class="card"><div class="g">
 <div><label>Guarda de turno – NOMBRES Y APELLIDOS</label><input id="gn" value="${esc(s.guard)}"><label style="margin-top:8px">Firma</label><canvas id="gc"></canvas><button class="btn" data-clr="gc">Borrar firma</button></div>
 <div><label>Supervisor de turno – NOMBRES Y APELLIDOS</label><input id="sn" value="${esc(s.sup)}"><label style="margin-top:8px">Firma</label><canvas id="sc"></canvas><button class="btn" data-clr="sc">Borrar firma</button></div></div>
 <div id="fm"></div><div class="row" style="margin-top:12px"><button class="btn pr" id="send">Finalizar y enviar reporte</button><span class="mu" id="cnt"></span></div></div>`;
 $("#form").innerHTML=h;
 pad(0);cnt();
 ["gc","sc"].forEach(i=>sigInit(i,i=="gc"?s.gs:s.ss));
}
function cnt(){const e=$("#cnt");if(e){const n=nph(st[cur]);e.textContent=st[cur].marks.size+" novedad(es) marcada(s)"+(n?" · "+n+" foto(s)":"")}}
function sigInit(id,img){
 const c=document.getElementById(id),r=c.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
 c.width=r.width*dpr;c.height=r.height*dpr;const x=c.getContext("2d");x.scale(dpr,dpr);x.lineWidth=2;x.lineCap="round";x.strokeStyle="#111";
 if(img){const im=new Image();im.onload=()=>x.drawImage(im,0,0,r.width,r.height);im.src=img}
 let d=false,l;const p=e=>{const b=c.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
 c.onpointerdown=e=>{d=true;l=p(e);c.setPointerCapture(e.pointerId)};
 c.onpointermove=e=>{if(!d)return;const q=p(e);x.beginPath();x.moveTo(...l);x.lineTo(...q);x.stroke();l=q};
 c.onpointerup=()=>{d=false;st[cur][id=="gc"?"gs":"ss"]=c.toDataURL("image/png");if(id=="gc")st[cur].gt=Date.now()};
}
document.addEventListener("click",e=>{
 const t=e.target;
 if(t.dataset.v){["r1","r2","dash"].forEach(v=>0);document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b===t));
  if(t.dataset.v=="dash"){$("#form").classList.add("hide");$("#dash").classList.remove("hide");renderDash()}
  else{cur=t.dataset.v;$("#dash").classList.add("hide");$("#form").classList.remove("hide");renderForm()}return}
 if(t.classList.contains("c")){const k=t.dataset.k,s=st[cur].marks;s.has(k)?s.delete(k):s.add(k);t.classList.toggle("x");t.textContent=s.has(k)?"SÍ":"—";cnt();return}
 if(t.dataset.clr){const c=document.getElementById(t.dataset.clr);c.getContext("2d").clearRect(0,0,c.width,c.height);st[cur][t.dataset.clr=="gc"?"gs":"ss"]=null;if(t.dataset.clr=="gc")st[cur].gt=null;return}
 if(t.id=="send")send();
 if(t.id=="li")FB.login($("#le").value,$("#lp").value).catch(()=>{$("#lm").innerHTML='<div class="msg err">Correo o contraseña incorrectos.</div>'});
});
document.addEventListener("input",e=>{const s=st[cur];if(e.target.id=="gn")s.guard=e.target.value;if(e.target.id=="sn")s.sup=e.target.value;if(e.target.id=="ob")s.obs=e.target.value;if(e.target.id=="fd")s.date=e.target.value});
function msg(t,c){$("#fm").innerHTML=`<div class="msg ${c}">${t}</div>`}
async function send(){
 const s=st[cur],def=R[cur];
 if(!s.date||!s.guard.trim()||!s.sup.trim())return msg("Complete la fecha y el nombre del guarda y del supervisor.","err");
 if(!s.gs||!s.ss)return msg("Faltan las firmas del guarda y/o del supervisor.","err");
 const rid=cur+"-"+s.date.replace(/-/g,"")+"-"+Date.now(),ph=[],nov=[];
 def.secs.forEach(sec=>sec.r.forEach((nm,i)=>{const cs=[],ims=s.photos[sec.k+"|"+i]||[];for(let c=0;c<8;c++)if(s.marks.has(sec.k+"|"+i+"|"+c))cs.push(COLS[c]);
  if(cs.length||ims.length){const e={s:sec.t,r:String(i+1).padStart(2,"0")+" "+nm,c:cs};if(ims.length)e.fs=ims.map(d=>{const pid=rid+"_"+ph.length;ph.push({id:pid,d});return pid});nov.push(e)}}));
 const rooms=def.secs.reduce((a,x)=>a+x.r.length,0);
 const doc={type:cur,title:def.n,date:s.date,signedAt:s.gt||Date.now(),guard:s.guard.trim(),sup:s.sup.trim(),gs:s.gs,ss:s.ss,obs:s.obs.trim(),nov,rooms,total:nov.reduce((a,x)=>a+x.c.length,0),createdAt:Date.now(),by:UID};
 if(!confirm("¿Finalizar y enviar el reporte? No podrá modificarse después."))return;
 $("#send").disabled=true;
 const id=rid;
 try{
  if(!window.FB)throw new Error("Firebase no cargó");
  await FB.add(id,doc,ph);
  msg("✔ Reporte enviado y guardado ("+id+"). Ya aparece en el Dashboard.","good");
  st[cur]=fresh();saveDraft();setTimeout(renderForm,2500);
 }catch(err){
  const q=safe(()=>JSON.parse(localStorage.getItem("pend")||"[]"),[]);q.push({id,doc,ph});
  safe(()=>localStorage.setItem("pend",JSON.stringify(q)));
  msg("No se pudo enviar ("+esc(err.message||err)+"). Se guardó una copia pendiente en este dispositivo; abra la página con sesión iniciada para reenviarla.","err");$("#send").disabled=false;
 }
}
async function flush(){
 if(!window.FB)return;const q=safe(()=>JSON.parse(localStorage.getItem("pend")||"[]"),[]);if(!q.length)return;
 const rest=[];for(const p of q){try{await FB.add(p.id,p.doc,p.ph)}catch(e){const m=String(e.message||e);if(!/permission|already|denied/i.test(m)||(p.ph&&p.ph.length&&(p.t=(p.t||0)+1)<6))rest.push(p)}}
 safe(()=>localStorage.setItem("pend",JSON.stringify(rest)));
}
function renderDash(){
 if(!AUTH){ED.on=false;$("#dash").innerHTML=`<div class="card"><b>Dashboard – acceso restringido</b><p class="mu">Ingrese con su correo y contraseña de supervisor/administrador.</p><div class="g"><div><label>Correo</label><input id="le" type="email"></div><div><label>Contraseña</label><input id="lp" type="password"></div></div><div class="row" style="margin-top:10px"><button class="btn pr" id="li">Ingresar</button></div><div id="lm"></div></div>`;return}
 const f=($("#fl")||{}).value||"",ft=($("#ft")||{}).value||"";
 let L=all.filter(d=>(!f||d.date==f)&&(!ft||d.type==ft));
 const nv=L.reduce((a,d)=>a+d.total,0),cn=L.filter(d=>d.total).length;
 let h=(ED.flash?'<div class="msg good">'+ED.flash+'</div>':"")+(ED.on?edHtml():"")+`<div class="k"><div><b>${L.length}</b>Reportes</div><div><b>${nv}</b>Novedades marcadas</div><div><b>${cn}</b>Reportes con novedad</div><div><b>${new Set(L.map(d=>d.date)).size}</b>Días</div></div>
 <div class="card"><div class="g"><div><label>Fecha</label><input type="date" id="fl" value="${f}"></div><div><label>Reporte</label><select id="ft"><option value="">Todos</option><option value="r1">Reporte 1</option><option value="r2">Reporte 2</option></select></div></div>
 <div class="row" style="margin-top:10px"><button class="btn" id="csv">Descargar CSV</button><button class="btn" data-ed="open">Editor de casillas</button><button class="btn" id="lo">Cerrar sesión</button><span class="mu">Datos guardados en Firebase (solo lectura, sin edición ni borrado).</span></div></div>`;
 h+=pdfCard();
 if(!L.length)h+='<div class="card mu">No hay reportes enviados con estos filtros.</div>';
 L.forEach(d=>{h+=`<div class="card"><div class="row"><b>${esc(d.title)}</b><span class="pill ${d.total?"":"ok"}">${d.total?d.total+" novedad(es)":"Sin novedad"}</span></div>
 <div class="mu">Fecha: ${esc(d.date)} · Firma del guarda: ${new Date(d.signedAt||d.createdAt).toLocaleString("es-CO")} · Guarda: ${esc(d.guard)} · Supervisor: ${esc(d.sup)}</div>
 <details><summary>Ver detalle y firmas</summary>${d.nov.map(n=>`<div style="margin:6px 0"><b>${esc(n.r)}</b> <span class="mu">${esc(fz(n.s))}</span><br>${n.c.map(c=>`<span class="pill">${esc(c)}</span>`).join(" ")}${(n.fs||(n.f?[n.f]:[])).map((f,j)=>` <button class="btn" data-ph="${esc(f)}">📷 Foto ${j+1}</button>`).join("")}</div>`).join("")||'<p class="mu">Sin novedades.</p>'}
 ${d.obs?`<p><b>Observaciones:</b> ${esc(d.obs)}</p>`:""}
 <div class="row"><div><div class="mu">Guarda</div><img class="sig" src="${d.gs}"></div><div><div class="mu">Supervisor</div><img class="sig" src="${d.ss}"></div></div></details></div>`});
 ED.flash="";$("#dash").innerHTML=h;$("#fl").value=f;$("#ft").value=ft;
 $("#fl").onchange=$("#ft").onchange=renderDash;
 $("#csv").onclick=async()=>{const rows=[["Reporte","Fecha","Firma guarda","Guarda","Supervisor","Sección","Aula","Novedades","Fotos","Observaciones"]];
  L.forEach(d=>{if(!d.nov.length)rows.push([d.title,d.date,new Date(d.signedAt||d.createdAt).toISOString(),d.guard,d.sup,"","","Sin novedad","",d.obs]);d.nov.forEach(n=>rows.push([d.title,d.date,new Date(d.signedAt||d.createdAt).toISOString(),d.guard,d.sup,fz(n.s),n.r,n.c.join("; "),(n.fs||(n.f?[n.f]:[])).length||"",d.obs]))});
  const data="\ufeff"+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"text/csv;charset=utf-8"}));a.download="reportes-novedades.csv";a.click()};
 if($("#lo"))$("#lo").onclick=()=>FB.logout();
}

/* ===== Editor de casillas (solo autorizados del Dashboard) ===== */
const ED={on:false,rep:"r1",sec:0,draft:null,flash:""};
const cl=o=>JSON.parse(JSON.stringify(o));
const fz=t=>String(t).replace(/Edificio\s+Acad[eé]mico/gi,"ZONA ACADÉMICA");
function applyLayout(o){
 let ch=false;
 ["r1","r2"].forEach(id=>{
  const secs=o&&o[id];
  if(!Array.isArray(secs)||!secs.length)return;
  const ok=secs.every(x=>x&&typeof x.k=="string"&&typeof x.t=="string"&&Array.isArray(x.r)&&x.r.every(n=>typeof n=="string"));
  if(!ok)return;
  secs.forEach(x=>{x.t=fz(x.t)});
  const old=R[id].secs;
  secs.forEach(ns=>{const os=old.find(z=>z.k==ns.k);
   if(!os||JSON.stringify(os.r)!=JSON.stringify(ns.r)){[...st[id].marks].forEach(m=>{if(m.split("|")[0]==ns.k)st[id].marks.delete(m)});Object.keys(st[id].photos||{}).forEach(k=>{if(k.split("|")[0]==ns.k)delete st[id].photos[k]})}});
  if(JSON.stringify(old)!=JSON.stringify(secs)){R[id].secs=secs.map(x=>({k:x.k,t:x.t,r:x.r.slice()}));ch=true}
 });
 if(ch){
  saveDraft();
  if(!$("#form").classList.contains("hide"))renderForm();

 im.onload=()=>{const k=Math.min(1,800/Math.max(im.width,im.height)),w=Math.round(im.width*k),h=Math.round(im.height*k),c=document.createElement("canvas");
  c.width=w;c.height=h;c.getContext("2d").drawImage(im,0,0,w,h);URL.revokeObjectURL(u);
  let q=.7,d=c.toDataURL("image/jpeg",q);while(d.length>70000&&q>.35){q-=.1;d=c.toDataURL("image/jpeg",q)}res(d)};
 im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("imagen no válida"))};im.src=u})}
